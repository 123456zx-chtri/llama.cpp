name: Build CUDA Windows

on:
  workflow_dispatch:

jobs:
  build:
    name: Build llama-server CUDA
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install CUDA
        run: |
          choco install cuda -version 12.4.1 --yes
          $env:Path += ";C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.4\bin"
          nvcc --version

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel 4
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-cuda
          path: build/bin/Release/llama-server.exe
